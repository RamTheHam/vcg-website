<svg xmlns="http://www.w3.org/2000/svg" width="320" height="172" viewBox="0 0 320 172" role="img" aria-label="LGT — A part of NTG Nordic Transport Group">
  <!-- dark-green corner accents behind the banner -->
  <polygon points="58,20 116,20 58,88" fill="#0E5C42"/>
  <polygon points="284,54 284,116 224,116" fill="#0E5C42"/>
  <!-- red banner (right-leaning parallelogram) -->
  <polygon points="96,20 284,20 248,116 60,116" fill="#E2001A"/>
  <!-- LGT wordmark -->
  <text x="170" y="96" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-style="italic" font-size="84"
        letter-spacing="-3" fill="#FFFFFF">LGT</text>
  <!-- green rounded bar -->
  <rect x="34" y="132" width="252" height="30" rx="15" fill="#0E5C42"/>
  <text x="160" y="151" text-anchor="middle"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-weight="600" font-size="12" letter-spacing="0.2"
        fill="#FFFFFF">A part of NTG Nordic Transport Group</text>
</svg>
